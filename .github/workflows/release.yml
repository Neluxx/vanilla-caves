name: Build & Release Datapack

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    uses: Neluxx/.github/.github/workflows/datapack-release.yml@main
    permissions:
      contents: write